name: sharemind-emulator-keydb

services:
  emulator:
    image: ${REGISTRY_URL:-sharemind.example/sharemind-mpc/runtime}/emulator:${VERSION:-latest}
    pull_policy: never
    command: ["--bytecode=secrec/keydb_example.sb"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
