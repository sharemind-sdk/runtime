[package]
name = "sharemind-runtime"
version = "0.1.0"
edition = "2021"
description = "Low footprint wrapper around Sharemind MPC components"
authors = ["Cybernetica <sharemind@cyber.ee>"]
homepage = "https://cyber.ee/products/sharemind-mpc"
repository = "https://github.com/sharemind-sdk/runtime"
readme = "README.md"
license = "GPL-3.0-only"
publish = false

[features]
profiler = []
tabledb = []
keydb = []
ctrl = []

[[bin]]
name = "protocol_io_client"
required-features = ["ctrl"]

[[bin]]
name = "secret_share_converter"
required-features = ["ctrl"]

[dependencies]
anyhow = "1.0"
byteorder = "1"
capnp = "0.23"
capnp-rpc = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
rand = "0.9"
scopeguard = "1.2"
static_assertions = "1.1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["net", "rt", "macros"]}
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
zmq = "0.10"

[build-dependencies]
bindgen = "0.72"
capnpc = "0.23"
cmake = "0.1"
vergen-gitcl = { version = "9.1.0", features = ["build"] }

[dev-dependencies]
tracing-test = "0.2"
